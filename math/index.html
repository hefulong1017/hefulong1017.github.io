<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高等数学上册 · 课本答案</title>
  <meta name="description" content="安徽大学版高等数学上册课本答案，按习题与复习题分类整理。">
  <meta name="theme-color" content="#f5f5f7">
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --muted: #6e6e73;
      --faint: #86868b; --line: rgba(0,0,0,.08); --accent: #0071e3;
      --accent-soft: rgba(0,113,227,.08); --radius: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    }
    [data-theme="dark"] {
      --bg: #000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6;
      --faint: #86868b; --line: rgba(255,255,255,.1); --accent: #2997ff;
      --accent-soft: rgba(41,151,255,.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 12px max(18px, calc((100vw - 1180px)/2));
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
    .back { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .top-actions a, .top-actions button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 8px 13px; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .top-actions a:hover, .top-actions button:hover { color: var(--ink); border-color: var(--muted); }

    .hero { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 52px 0 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.045em; line-height: 1.06; }
    .sub { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .note { margin: 18px 0 0; color: var(--faint); font-size: 12px; max-width: 56em; line-height: 1.8; }

    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto 60px; display: grid; grid-template-columns: 268px minmax(0,1fr); gap: 22px; align-items: start; }
    .side {
      position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto;
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      padding: 14px 10px; box-shadow: 0 12px 40px rgba(0,0,0,.05);
    }
    .search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: 12px; outline: none; }
    .search:focus { border-color: var(--accent); }
    .chapter { margin-top: 14px; }
    .chapter h2 { margin: 0 8px 6px; color: var(--faint); font-size: 10px; letter-spacing: .1em; font-weight: 700; }
    .sec {
      display: block; width: 100%; border: 0; background: transparent; text-align: left;
      padding: 8px 9px; border-radius: 9px; color: var(--muted); font-size: 12px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sec:hover { background: var(--accent-soft); color: var(--ink); }
    .sec.active { background: var(--ink); color: var(--bg); }

    .reader {
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.06); overflow: hidden;
    }
    .reader-head { padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
    .reader-kicker { color: var(--faint); font-size: 10px; letter-spacing: .1em; }
    .reader h2 { margin: 7px 0 6px; font-size: clamp(23px, 3vw, 30px); letter-spacing: -.025em; }
    .reader-meta { display: flex; flex-wrap: wrap; gap: 12px; color: var(--faint); font-size: 11px; }
    .reader-meta a { color: var(--accent); }
    .answer-text {
      margin: 0; padding: 24px 26px 30px; white-space: pre-wrap; word-break: break-word;
      font: 15px/1.95 var(--serif); color: var(--ink); overflow-wrap: anywhere;
    }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 26px 22px; }
    .pager button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 8px 14px; font-size: 11px; color: var(--muted); cursor: pointer;
    }
    .pager button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
    .pager button:disabled { opacity: .35; cursor: default; }
    .pager span { color: var(--faint); font-size: 10px; }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
      .side { position: static; max-height: 250px; }
      .answer-text { padding: 18px 18px 24px; font-size: 14px; }
      .reader-head, .pager { padding-left: 18px; padding-right: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="../"><span class="back">何</span>何富龙</a>
    <div class="top-actions">
      <a href="advanced-math.pdf" download>下载 PDF</a>
      <a href="../">返回主页</a>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">ADVANCED MATHEMATICS · 上册</p>
    <h1>高等数学上册 · 课本答案</h1>
    <p class="sub">安徽大学版 · 230 页 · 39 个习题与复习题</p>
    <p class="note">按「习题 / 复习题」分类整理。文字由 PDF 识别后做过基础校对，分数、根式、上下标的排版可能仍有偏差；点每节的「PDF 第 X 页」可直接核对原页。</p>
  </section>

  <div class="wrap">
    <aside class="side" aria-label="章节目录">
      <input class="search" id="search" type="search" placeholder="搜索章节或答案…" autocomplete="off">
      <div id="toc"></div>
    </aside>

    <main class="reader">
      <div class="reader-head">
        <div class="reader-kicker" id="kicker">SECTION</div>
        <h2 id="title">选择一个章节</h2>
        <div class="reader-meta">
          <span id="pages"></span>
          <a id="pdf-link" href="advanced-math.pdf" target="_blank" rel="noreferrer">PDF 原页 ↗</a>
        </div>
      </div>
      <pre class="answer-text" id="text">正在加载…</pre>
      <div class="pager">
        <button id="prev" type="button">← 上一节</button>
        <span id="count"></span>
        <button id="next" type="button">下一节 →</button>
      </div>
    </main>
  </div>

  <script src="data.js"></script>
  <script>
    (function () {
      var data = window.ADV_MATH;
      if (!data) return;
      var flat = [];
      data.chapters.forEach(function (ch) {
        ch.sections.forEach(function (s) { flat.push({ ch: ch.name, sec: s }); });
      });
      var toc = document.getElementById('toc');
      var title = document.getElementById('title');
      var kicker = document.getElementById('kicker');
      var pages = document.getElementById('pages');
      var pdf = document.getElementById('pdf-link');
      var text = document.getElementById('text');
      var count = document.getElementById('count');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var search = document.getElementById('search');
      var current = 0;

      function renderToc(filter) {
        toc.innerHTML = '';
        var q = (filter || '').trim().toLowerCase();
        var shown = 0;
        data.chapters.forEach(function (ch) {
          var wrap = document.createElement('div');
          wrap.className = 'chapter';
          var h = document.createElement('h2');
          h.textContent = ch.name;
          wrap.appendChild(h);
          ch.sections.forEach(function (s) {
            var idx = flat.findIndex(function (x) { return x.sec.id === s.id; });
            if (q && (s.title + '\n' + s.text).toLowerCase().indexOf(q) < 0) return;
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'sec' + (idx === current ? ' active' : '');
            b.textContent = s.title;
            b.title = s.title;
            b.addEventListener('click', function () { select(idx); });
            wrap.appendChild(b);
            shown++;
          });
          if (wrap.querySelector('.sec')) toc.appendChild(wrap);
        });
        if (!shown) {
          var empty = document.createElement('div');
          empty.className = 'sec';
          empty.textContent = '没有匹配的章节';
          toc.appendChild(empty);
        }
      }

      function select(i) {
        if (i < 0 || i >= flat.length) return;
        current = i;
        var item = flat[i];
        var s = item.sec;
        title.textContent = s.title;
        kicker.textContent = item.ch + ' · ' + s.start + '–' + s.end + ' 页';
        pages.textContent = '第 ' + s.start + '–' + s.end + ' 页';
        pdf.href = 'advanced-math.pdf#page=' + s.start;
        text.textContent = s.text || '（本节暂无文字）';
        count.textContent = (i + 1) + ' / ' + flat.length;
        prev.disabled = i === 0;
        next.disabled = i === flat.length - 1;
        renderToc(search.value);
        history.replaceState(null, '', '#' + s.id);
        document.querySelector('.reader').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      prev.addEventListener('click', function () { select(current - 1); });
      next.addEventListener('click', function () { select(current + 1); });
      search.addEventListener('input', function () { renderToc(search.value); });
      document.addEventListener('keydown', function (e) {
        if (e.target === search) return;
        if (e.key === 'ArrowLeft') select(current - 1);
        if (e.key === 'ArrowRight') select(current + 1);
      });

      var hash = location.hash.replace('#', '');
      var start = Math.max(0, flat.findIndex(function (x) { return x.sec.id === hash; }));
      renderToc('');
      select(start);
    })();
  </script>
</body>
</html>
