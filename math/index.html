<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>高等数学上册 · 课本答案</title>
  <meta name="description" content="安徽大学版高等数学上册课本答案，按习题与复习题分类整理。">
  <meta name="theme-color" content="#f5f5f7">
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --muted: #6e6e73;
      --faint: #86868b; --line: rgba(0,0,0,.08); --accent: #0071e3;
      --accent-soft: rgba(0,113,227,.08); --radius: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    }
    [data-theme="dark"] {
      --bg: #000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6;
      --faint: #86868b; --line: rgba(255,255,255,.1); --accent: #2997ff;
      --accent-soft: rgba(41,151,255,.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 12px max(18px, calc((100vw - 1180px)/2));
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
    .back { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .top-actions a, .top-actions button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 8px 13px; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .top-actions a:hover, .top-actions button:hover { color: var(--ink); border-color: var(--muted); }

    .hero { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 52px 0 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.045em; line-height: 1.06; }
    .sub { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .note { margin: 18px 0 0; color: var(--faint); font-size: 12px; max-width: 56em; line-height: 1.8; }

    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto 60px; display: grid; grid-template-columns: 268px minmax(0,1fr); gap: 22px; align-items: start; }
    .side {
      position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto;
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      padding: 14px 10px; box-shadow: 0 12px 40px rgba(0,0,0,.05);
    }
    .search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: 12px; outline: none; }
    .search:focus { border-color: var(--accent); }
    .chapter { margin-top: 14px; }
    .chapter h2 { margin: 0 8px 6px; color: var(--faint); font-size: 10px; letter-spacing: .1em; font-weight: 700; }
    .sec {
      display: block; width: 100%; border: 0; background: transparent; text-align: left;
      padding: 8px 9px; border-radius: 9px; color: var(--muted); font-size: 12px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sec:hover { background: var(--accent-soft); color: var(--ink); }
    .sec.active { background: var(--ink); color: var(--bg); }

    .reader {
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.06); overflow: hidden;
    }
    .reader-head { padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
    .reader-kicker { color: var(--faint); font-size: 10px; letter-spacing: .1em; }
    .reader h2 { margin: 7px 0 6px; font-size: clamp(23px, 3vw, 30px); letter-spacing: -.025em; }
    .reader-meta { display: flex; flex-wrap: wrap; gap: 12px; color: var(--faint); font-size: 11px; }
    .reader-meta a { color: var(--accent); }
    .view-switch { display: flex; gap: 8px; padding: 12px 26px 0; }
    .view-switch button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 7px 13px; color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .view-switch button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .page-images { display: grid; gap: 16px; padding: 16px 26px 24px; background: #e9e9ed; }
    [data-theme="dark"] .page-images { background: #0b0b0d; }
    .page-images img {
      display: block; width: 100%; height: auto; background: #fff;
      border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .page-images[hidden], .answer-text[hidden] { display: none; }

    .latex-view { padding: 16px 26px 26px; }
    .latex-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .latex-toolbar button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 11px; font-size: 11px; cursor: pointer;
    }
    .latex-toolbar button:hover { color: var(--ink); border-color: var(--muted); }
    .latex-toolbar span { color: var(--faint); font-size: 10px; margin-left: auto; }
    .latex-preview {
      white-space: pre-wrap; word-break: break-word; font: 15px/1.95 var(--serif);
      color: var(--ink); font-weight: 400; padding: 18px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); min-height: 300px;
    }
    .latex-preview .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .latex-source {
      display: block; width: 100%; min-height: 420px; resize: vertical;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      color: var(--ink); padding: 16px; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .latex-source[hidden], .latex-preview[hidden] { display: none; }
    .answer-text {
      margin: 0; padding: 24px 26px 30px; white-space: pre-wrap; word-break: break-word;
      font: 15px/1.95 var(--serif); color: var(--ink); overflow-wrap: anywhere;
    }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 26px 22px; }
    .pager button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 8px 14px; font-size: 11px; color: var(--muted); cursor: pointer;
    }
    .pager button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
    .pager button:disabled { opacity: .35; cursor: default; }
    .pager span { color: var(--faint); font-size: 10px; }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: 1fr; }
      .side { position: static; max-height: 250px; }
      .view-switch, .page-images { padding-left: 18px; padding-right: 18px; }
      .page-images { gap: 12px; }
      .answer-text { padding: 18px 18px 24px; font-size: 14px; }
      .reader-head, .pager { padding-left: 18px; padding-right: 18px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
  <link rel="stylesheet" href="../katex.min.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="../"><span class="back">何</span>何富龙</a>
    <div class="top-actions">
      <a href="advanced-math.pdf" download>下载 PDF</a>
      <a href="../">返回主页</a>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">ADVANCED MATHEMATICS · 上册</p>
    <h1>高等数学上册 · 课本答案</h1>
    <p class="sub">安徽大学版 · 230 页 · 39 个习题与复习题</p>
    <p class="note">按「习题 / 复习题」分类整理。默认显示可编辑、可复制的 LaTeX 源码并实时渲染；「排版页」可对照原 PDF，「文字」用于全文检索。</p>
  </section>

  <div class="wrap">
    <aside class="side" aria-label="章节目录">
      <input class="search" id="search" type="search" placeholder="搜索章节或答案…" autocomplete="off">
      <div id="toc"></div>
    </aside>

    <main class="reader">
      <div class="reader-head">
        <div class="reader-kicker" id="kicker">SECTION</div>
        <h2 id="title">选择一个章节</h2>
        <div class="reader-meta">
          <span id="pages"></span>
          <a id="pdf-link" href="advanced-math.pdf" target="_blank" rel="noreferrer">PDF 原页 ↗</a>
        </div>
      </div>
      <div class="view-switch"><button id="view-pages" type="button">排版页</button><button id="view-latex" type="button" class="active">LaTeX</button><button id="view-text" type="button">文字</button></div>
      <div class="page-images" id="page-images" hidden></div>
      <div class="latex-view" id="latex-view">
        <div class="latex-toolbar">
          <button id="latex-edit" type="button">源码 / 编辑</button>
          <button id="latex-copy" type="button">复制本节 LaTeX</button>
          <button id="latex-copy-doc" type="button">复制完整 .tex</button>
          <span>可直接编辑；复制后可在 Overleaf / TeX Live 编译</span>
        </div>
        <div class="latex-preview" id="latex-preview">正在转换…</div>
        <textarea class="latex-source" id="latex-source" spellcheck="false" hidden></textarea>
      </div>
      <pre class="answer-text" id="text" hidden>正在加载…</pre>
      <div class="pager">
        <button id="prev" type="button">← 上一节</button>
        <span id="count"></span>
        <button id="next" type="button">下一节 →</button>
      </div>
    </main>
  </div>

  <script src="../katex.min.js"></script>
  <script src="../auto-render.min.js"></script>
  <script src="data.js"></script>
  <script>
    (function () {
      var data = window.ADV_MATH;
      if (!data) return;
      var flat = [];
      data.chapters.forEach(function (ch) {
        ch.sections.forEach(function (s) { flat.push({ ch: ch.name, sec: s }); });
      });
      var toc = document.getElementById('toc');
      var title = document.getElementById('title');
      var kicker = document.getElementById('kicker');
      var pages = document.getElementById('pages');
      var pdf = document.getElementById('pdf-link');
      var text = document.getElementById('text');
      var count = document.getElementById('count');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var search = document.getElementById('search');
      var pageImages = document.getElementById('page-images');
      var viewPages = document.getElementById('view-pages');
      var viewText = document.getElementById('view-text');
      var viewLatex = document.getElementById('view-latex');
      var latexView = document.getElementById('latex-view');
      var latexPreview = document.getElementById('latex-preview');
      var latexSource = document.getElementById('latex-source');
      var viewMode = 'latex';
      var current = 0;


      function latexForDisplay(s) {
        return String(s || '')
          .replace(/\\section\*\{([^}]*)\}/g, '$1')
          .replace(/\\subsection\*\{([^}]*)\}/g, '$1')
          .replace(/\\textbf\{([^}]*)\}/g, '$1')
          .replace(/\\emph\{([^}]*)\}/g, '$1')
          .replace(/\\text\{([^{}]*)\}/g, '$1')
          .replace(/\\quad/g, ' ')
          .replace(/\\qquad/g, ' ')
          .replace(/\\ /g, ' ');
      }

      function renderLatex() {
        var sec = flat[current].sec;
        var src = sec.latex || '';
        latexSource.value = src;
        if (!src) {
          latexPreview.textContent = '本节的 LaTeX 源码还在转换中，稍后刷新。';
          return;
        }
        latexPreview.textContent = latexForDisplay(src);
        if (window.renderMathInElement) {
          window.renderMathInElement(latexPreview, {
            delimiters: [
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        }
      }

      function copyText(t) {
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        return Promise.resolve();
      }

      function docWrap(body) {
        return '\\documentclass[11pt]{article}\n\\usepackage[margin=2.2cm]{geometry}\n\\usepackage{amsmath,amssymb}\n\\usepackage[UTF8]{ctex}\n\\begin{document}\n\n' + body + '\n\n\\end{document}\n';
      }

      function renderToc(filter) {
        toc.innerHTML = '';
        var q = (filter || '').trim().toLowerCase();
        var shown = 0;
        data.chapters.forEach(function (ch) {
          var wrap = document.createElement('div');
          wrap.className = 'chapter';
          var h = document.createElement('h2');
          h.textContent = ch.name;
          wrap.appendChild(h);
          ch.sections.forEach(function (s) {
            var idx = flat.findIndex(function (x) { return x.sec.id === s.id; });
            if (q && (s.title + '\n' + s.text).toLowerCase().indexOf(q) < 0) return;
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'sec' + (idx === current ? ' active' : '');
            b.textContent = s.title;
            b.title = s.title;
            b.addEventListener('click', function () { select(idx); });
            wrap.appendChild(b);
            shown++;
          });
          if (wrap.querySelector('.sec')) toc.appendChild(wrap);
        });
        if (!shown) {
          var empty = document.createElement('div');
          empty.className = 'sec';
          empty.textContent = '没有匹配的章节';
          toc.appendChild(empty);
        }
      }

      function select(i, scroll) {
        if (i < 0 || i >= flat.length) return;
        current = i;
        var item = flat[i];
        var s = item.sec;
        title.textContent = s.title;
        kicker.textContent = item.ch + ' · ' + s.start + '–' + s.end + ' 页';
        pages.textContent = '第 ' + s.start + '–' + s.end + ' 页';
        pdf.href = 'advanced-math.pdf#page=' + s.start;
        text.textContent = s.text || '（本节暂无文字）';
        var html = '';
        for (var n = s.start; n <= s.end; n++) {
          var num = ('00' + n).slice(-3);
          html += '<img loading="lazy" src="pages/' + num + '.jpg" alt="' + s.title + ' 第 ' + n + ' 页">';
        }
        pageImages.innerHTML = html;
        pageImages.hidden = viewMode !== 'pages';
        text.hidden = viewMode !== 'text';
        latexView.hidden = viewMode !== 'latex';
        renderLatex();
        count.textContent = (i + 1) + ' / ' + flat.length;
        prev.disabled = i === 0;
        next.disabled = i === flat.length - 1;
        renderToc(search.value);
        history.replaceState(null, '', '#' + s.id);
        if (scroll !== false) document.querySelector('.reader').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function setView(mode) {
        viewMode = mode;
        pageImages.hidden = mode !== 'pages';
        text.hidden = mode !== 'text';
        latexView.hidden = mode !== 'latex';
        viewPages.classList.toggle('active', mode === 'pages');
        viewLatex.classList.toggle('active', mode === 'latex');
        viewText.classList.toggle('active', mode === 'text');
        if (mode === 'latex') renderLatex();
      }
      viewPages.addEventListener('click', function () { setView('pages'); });
      viewLatex.addEventListener('click', function () { setView('latex'); });
      viewText.addEventListener('click', function () { setView('text'); });

      document.getElementById('latex-copy').addEventListener('click', function () {
        copyText(latexSource.value);
        this.textContent = '已复制';
        var b = this;
        setTimeout(function () { b.textContent = '复制本节 LaTeX'; }, 1400);
      });
      document.getElementById('latex-copy-doc').addEventListener('click', function () {
        copyText(docWrap(latexSource.value));
        this.textContent = '已复制 .tex';
        var b = this;
        setTimeout(function () { b.textContent = '复制完整 .tex'; }, 1600);
      });
      document.getElementById('latex-edit').addEventListener('click', function () {
        var showSource = latexSource.hidden;
        latexSource.hidden = !showSource;
        latexPreview.hidden = showSource;
        this.textContent = showSource ? '渲染预览' : '源码 / 编辑';
        if (!showSource) {
          latexPreview.textContent = latexForDisplay(latexSource.value);
          if (window.renderMathInElement) {
            window.renderMathInElement(latexPreview, {
              delimiters: [
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
              ],
              throwOnError: false
            });
          }
        }
      });

      prev.addEventListener('click', function () { select(current - 1); });
      next.addEventListener('click', function () { select(current + 1); });
      search.addEventListener('input', function () { renderToc(search.value); });
      document.addEventListener('keydown', function (e) {
        if (e.target === search) return;
        if (e.key === 'ArrowLeft') select(current - 1);
        if (e.key === 'ArrowRight') select(current + 1);
      });

      var hash = location.hash.replace('#', '');
      var start = Math.max(0, flat.findIndex(function (x) { return x.sec.id === hash; }));
      renderToc('');
      select(start, false);
    })();
  </script>
</body>
</html>
