<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var d=localStorage.getItem("darkDefault");if(d!=="1"){localStorage.setItem("theme","dark");localStorage.setItem("darkDefault","1");}var t=localStorage.getItem("theme")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","dark");}</script>

  <title>高等数学上册 · 课本答案</title>
  <meta name="description" content="安徽大学版高等数学上册课本答案，按习题与复习题分类整理。">
  <meta name="theme-color" content="#f5f5f7">
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --muted: #6e6e73;
      --faint: #86868b; --line: rgba(0,0,0,.08); --accent: #0071e3;
      --accent-soft: rgba(0,113,227,.08); --radius: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    }
    [data-theme="dark"] {
      --bg: #000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6;
      --faint: #86868b; --line: rgba(255,255,255,.1); --accent: #2997ff;
      --accent-soft: rgba(41,151,255,.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; }

    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 12px max(18px, calc((100vw - 1180px)/2));
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
    .back { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .top-actions a, .top-actions button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 8px 13px; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .top-actions a:hover, .top-actions button:hover { color: var(--ink); border-color: var(--muted); }

    .hero { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 52px 0 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.045em; line-height: 1.06; }
    .sub { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .note { margin: 18px 0 0; color: var(--faint); font-size: 12px; max-width: 56em; line-height: 1.8; }

    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto 60px; display: grid; grid-template-columns: 268px minmax(0,1fr); gap: 22px; align-items: start; }
    .side {
      position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto;
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      padding: 14px 10px; box-shadow: 0 12px 40px rgba(0,0,0,.05);
    }
    .search { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; font-size: 12px; outline: none; }
    .search:focus { border-color: var(--accent); }
    .chapter { margin-top: 14px; }
    .chapter h2 { margin: 0 8px 6px; color: var(--faint); font-size: 10px; letter-spacing: .1em; font-weight: 700; }
    .sec {
      display: block; width: 100%; border: 0; background: transparent; text-align: left;
      padding: 8px 9px; border-radius: 9px; color: var(--muted); font-size: 12px; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sec:hover { background: var(--accent-soft); color: var(--ink); }
    .sec.active { background: var(--ink); color: var(--bg); }

    .reader {
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 12px 40px rgba(0,0,0,.06); overflow: hidden;
    }
    .reader-head { padding: 22px 26px 16px; border-bottom: 1px solid var(--line); }
    .reader-kicker { color: var(--faint); font-size: 10px; letter-spacing: .1em; }
    .reader h2 { margin: 7px 0 6px; font-size: clamp(23px, 3vw, 30px); letter-spacing: -.025em; }
    .reader-meta { display: flex; flex-wrap: wrap; gap: 12px; color: var(--faint); font-size: 11px; }
    .reader-meta a { color: var(--accent); }
    .view-switch { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 26px 0; }
    .view-switch button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 7px 13px; color: var(--muted); font-size: 11px; cursor: pointer;
    }
    .view-switch button.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .page-images { display: grid; gap: 16px; padding: 16px 26px 24px; background: #e9e9ed; }
    [data-theme="dark"] .page-images { background: #0b0b0d; }
    .page-images img {
      display: block; width: 100%; height: auto; background: #fff;
      border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .page-images[hidden], .answer-text[hidden], .qa-view[hidden] { display: none; }

    .qa-view { padding: 16px 26px 26px; }
    .qa-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 12px; }
    .qa-count { color: var(--muted); font-size: 12px; }
    .qa-count b { color: var(--ink); font-weight: 600; }
    .qa-tools { display: flex; gap: 8px; }
    .qa-tools button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 11px; font-size: 11px; cursor: pointer;
    }
    .qa-tools button:hover { color: var(--ink); border-color: var(--muted); }
    .qa-intro {
      margin: 0 0 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
      color: var(--muted); font: 13px/1.85 var(--serif); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .qa-card { padding: 22px 0 20px; border-top: 1px solid var(--line); }
    .qa-card:first-child { border-top: 0; padding-top: 6px; }
    .qa-head { display: grid; grid-template-columns: 38px minmax(0,1fr); gap: 14px; align-items: start; }
    .qa-num {
      display: grid; place-items: center; min-width: 34px; height: 26px; margin-top: 2px;
      border-radius: 8px; background: var(--accent-soft); color: var(--accent);
      font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .qa-q {
      font: 15px/1.95 var(--serif); color: var(--ink);
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    }
    .qa-q .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .qa-actions { padding-left: 52px; margin-top: 10px; }
    .qa-toggle {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 12px; font-size: 11px; cursor: pointer;
    }
    .qa-toggle:hover { color: var(--accent); border-color: var(--accent); }
    .qa-a {
      margin: 12px 0 0 52px; padding: 16px 18px 18px;
      border-left: 2px solid var(--accent); border-radius: 0 12px 12px 0;
      background: color-mix(in srgb, var(--accent-soft) 72%, var(--surface));
    }
    .qa-a-tag { margin-bottom: 8px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .1em; }
    .qa-a-body {
      font: 15px/1.9 var(--serif); color: var(--ink);
      white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
    }
    .qa-a-body .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .qa-empty { padding: 30px 0; color: var(--faint); font-size: 13px; }

    .latex-view { padding: 16px 26px 26px; }
    .latex-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .latex-toolbar button {
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 6px 11px; font-size: 11px; cursor: pointer;
    }
    .latex-toolbar button:hover { color: var(--ink); border-color: var(--muted); }
    .latex-toolbar span { color: var(--faint); font-size: 10px; margin-left: auto; }
    .latex-preview {
      white-space: pre-wrap; word-break: break-word; font: 15px/1.95 var(--serif);
      color: var(--ink); font-weight: 400; padding: 18px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--surface); min-height: 300px;
    }
    .latex-preview .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }
    .latex-source {
      display: block; width: 100%; min-height: 420px; resize: vertical;
      border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
      color: var(--ink); padding: 16px; font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .latex-source[hidden], .latex-preview[hidden] { display: none; }
    .answer-text {
      margin: 0; padding: 24px 26px 30px; white-space: pre-wrap; word-break: break-word;
      font: 15px/1.95 var(--serif); color: var(--ink); overflow-wrap: anywhere;
    }
    .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 26px 22px; }
    .pager button {
      border: 1px solid var(--line); background: transparent; border-radius: 999px;
      padding: 8px 14px; font-size: 11px; color: var(--muted); cursor: pointer;
    }
    .pager button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
    .pager button:disabled { opacity: .35; cursor: default; }
    .pager span { color: var(--faint); font-size: 10px; }

    @media (max-width: 820px) {
      .wrap { grid-template-columns: minmax(0,1fr); }
      .side, .reader { min-width: 0; }
      .side { position: static; max-height: 250px; }
      .view-switch, .page-images, .qa-view, .latex-view { padding-left: 18px; padding-right: 18px; }
      .page-images { gap: 12px; }
      .answer-text { padding: 18px 18px 24px; font-size: 14px; }
      .reader-head, .pager { padding-left: 18px; padding-right: 18px; }
      .qa-toolbar { align-items: flex-start; }
      .qa-tools { width: 100%; }
      .qa-head { grid-template-columns: 26px minmax(0,1fr); gap: 10px; }
      .qa-num { min-width: 26px; }
      .qa-actions { padding-left: 0; }
      .qa-a { margin-left: 0; padding: 14px 14px 16px; }
      .qa-q, .qa-a-body { font-size: 14px; }
      .qa-q .katex-display, .qa-a-body .katex-display { max-width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  
    [data-theme="dark"] .sec.active { background: #2c2c2e; color: #fff; }
    [data-theme="dark"] .view-switch button.active { background: #2c2c2e; color: #fff; border-color: #3a3a3c; }
</style>

<body>

  <header class="top">
    <a class="brand" href="../"><span class="back">何</span>何富龙</a>
    <div class="top-actions">
      <a href="advanced-math.pdf" download>下载 PDF</a>

    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">ADVANCED MATHEMATICS · 上册</p>

    <p class="sub">安徽大学版 · 230 页 · 39 个习题与复习题</p>
  </section>

  <div class="wrap">
    <aside class="side" aria-label="章节目录">
      <input class="search" id="search" type="search" placeholder="搜索章节或答案…" autocomplete="off">
      <div id="toc"></div>
    </aside>

    <main class="reader">
      <div class="reader-head">
        <div class="reader-kicker" id="kicker">SECTION</div>
        <h2 id="title">选择一个章节</h2>
        <div class="reader-meta">
          <span id="pages"></span>
          <a id="pdf-link" href="advanced-math.pdf" target="_blank" rel="noreferrer">PDF 原页 ↗</a>
        </div>
      </div>
      <div class="view-switch">
        <button id="view-qa" type="button" class="active">题目答案</button>
        <button id="view-latex" type="button">LaTeX 源码</button>
        <button id="view-pages" type="button">排版页</button>
        <button id="view-text" type="button">文字</button>
      </div>

      <div class="qa-view" id="qa-view">
        <div class="qa-toolbar">
          <div class="qa-count" id="qa-count">正在加载…</div>
          <div class="qa-tools">
            <button id="qa-expand" type="button">全部展开</button>
            <button id="qa-collapse" type="button">全部收起</button>
          </div>
        </div>
        <div class="qa-intro" id="qa-intro" hidden></div>
        <div class="qa-list" id="qa-list"></div>
      </div>

      <div class="page-images" id="page-images" hidden></div>
      <div class="latex-view" id="latex-view" hidden>
        <div class="latex-toolbar">
          <button id="latex-edit" type="button">源码 / 编辑</button>
          <button id="latex-copy" type="button">复制本节 LaTeX</button>
          <button id="latex-copy-doc" type="button">复制完整 .tex</button>
          <span>可直接编辑；复制后可在 Overleaf / TeX Live 编译</span>
        </div>
        <div class="latex-preview" id="latex-preview">正在转换…</div>
        <textarea class="latex-source" id="latex-source" spellcheck="false" hidden></textarea>
      </div>
      <pre class="answer-text" id="text" hidden>正在加载…</pre>
      <div class="pager">

  </div>

  <script src="../katex.min.js"></script>
  <script src="../auto-render.min.js"></script>
  <script src="index.js?v=1"></script>
  <script>
    (function () {
      var data = window.ADV_MATH_INDEX;
      if (!data) return;
      var flat = [];
      data.chapters.forEach(function (ch) {
        ch.sections.forEach(function (s) { flat.push({ ch: ch.name, sec: s }); });
      });

      var toc = document.getElementById('toc');
      var title = document.getElementById('title');
      var kicker = document.getElementById('kicker');
      var pages = document.getElementById('pages');
      var pdf = document.getElementById('pdf-link');
      var text = document.getElementById('text');
      var count = document.getElementById('count');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var search = document.getElementById('search');
      var pageImages = document.getElementById('page-images');
      var qaView = document.getElementById('qa-view');
      var qaList = document.getElementById('qa-list');
      var qaIntro = document.getElementById('qa-intro');
      var qaCount = document.getElementById('qa-count');
      var viewQa = document.getElementById('view-qa');
      var viewPages = document.getElementById('view-pages');
      var viewText = document.getElementById('view-text');
      var viewLatex = document.getElementById('view-latex');
      var latexView = document.getElementById('latex-view');
      var latexPreview = document.getElementById('latex-preview');
      var latexSource = document.getElementById('latex-source');
      var itemsCache = {};
      var itemsLoading = {};
      var sectionCache = {};
      var sectionLoading = {};
      var viewMode = 'qa';
      var current = 0;
      var renderToken = 0;

      function cleanDisplay(s) {
        return String(s || '')
          .replace(/\\section\*\{([^}]*)\}/g, '$1')
          .replace(/\\subsection\*\{([^}]*)\}/g, '$1')
          .replace(/\\begin\{itemize\}|\\end\{itemize\}|\\begin\{enumerate\}|\\end\{enumerate\}/g, '')
          .replace(/\\item\s*/g, '• ')
          .replace(/\\textbf\{([^{}]*)\}/g, '$1')
          .replace(/\\emph\{([^{}]*)\}/g, '$1')
          .replace(/\\text\{([^{}]*)\}/g, '$1')
          .replace(/\\quad/g, ' ')
          .replace(/\\qquad/g, ' ')
          .replace(/\\ /g, ' ')
          .replace(/\n{3,}/g, '\n\n');
      }

      function cleanAnswer(s) {
        var t = cleanDisplay(s);
        var n = (t.match(/答案\s*[：:]/g) || []).length;
        if (n >= 2) {
          return t.replace(/(^|\n)\s*答案\s*[：:]\s*/g, '$1• ').replace(/\n{2,}/g, '\n');
        }
        return t.replace(/^\s*答案\s*[：:]\s*/, '').replace(/\n{3,}/g, '\n\n');
      }

      function typeset(el) {
        if (window.renderMathInElement) {
          window.renderMathInElement(el, {
            delimiters: [
              { left: '\\[', right: '\\]', display: true },
              { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
          });
        }
      }

      function loadSection(id) {
        if (sectionCache[id]) return Promise.resolve(sectionCache[id]);
        if (sectionLoading[id]) return sectionLoading[id];
        sectionLoading[id] = new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = 'sections/' + encodeURIComponent(id) + '.js?v=1';
          s.onload = function () {
            var sec = (window.ADV_MATH_SECTIONS || {})[id] || null;
            if (sec) {
              sectionCache[id] = sec;
              var target = flat.find(function (x) { return x.sec.id === id; });
              if (target) target.sec = sec;
            }
            resolve(sec);
          };
          s.onerror = function () { resolve(null); };
          document.head.appendChild(s);
        });
        return sectionLoading[id];
      }

      function loadItems(id) {
        if (Object.prototype.hasOwnProperty.call(itemsCache, id)) return Promise.resolve(itemsCache[id]);
        if (itemsLoading[id]) return itemsLoading[id];
        itemsLoading[id] = new Promise(function (resolve) {
          var s = document.createElement('script');
          s.src = 'items/' + encodeURIComponent(id) + '.js?v=1';
          s.onload = function () {
            itemsCache[id] = (window.ADV_MATH_ITEMS || {})[id] || null;
            resolve(itemsCache[id]);
          };
          s.onerror = function () {
            itemsCache[id] = null;
            resolve(null);
          };
          document.head.appendChild(s);
        });
        return itemsLoading[id];
      }

      function makeCard(item, index) {
        var card = document.createElement('article');
        card.className = 'qa-card';

        var head = document.createElement('div');
        head.className = 'qa-head';
        var num = document.createElement('span');
        num.className = 'qa-num';
        num.textContent = item.label || String(index + 1);
        var q = document.createElement('div');
        q.className = 'qa-q';
        q.textContent = (cleanDisplay(item.q) || '（题目略）').replace(/\n{2,}/g, '\n');
        head.appendChild(num);
        head.appendChild(q);
        card.appendChild(head);

        var hasAnswer = Boolean((item.a || '').trim());
        var ans = null;
        if (hasAnswer) {
          var actions = document.createElement('div');
          actions.className = 'qa-actions';
          var toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'qa-toggle';
          toggle.setAttribute('aria-expanded', 'false');
          toggle.innerHTML = '显示答案 <span aria-hidden="true">↓</span>';
          actions.appendChild(toggle);
          card.appendChild(actions);

          ans = document.createElement('div');
          ans.className = 'qa-a';
          ans.hidden = true;
          var tag = document.createElement('div');
          tag.className = 'qa-a-tag';
          tag.textContent = '参考答案';
          var body = document.createElement('div');
          body.className = 'qa-a-body';
          ans.appendChild(tag);
          ans.appendChild(body);
          card.appendChild(ans);

          toggle.addEventListener('click', function () {
            var open = ans.hidden;
            ans.hidden = !open;
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.innerHTML = open
              ? '收起答案 <span aria-hidden="true">↑</span>'
              : '显示答案 <span aria-hidden="true">↓</span>';
            if (open && !ans.dataset.rendered) {
              body.textContent = cleanAnswer(item.a);
              typeset(body);
              ans.dataset.rendered = '1';
            }
          });
        }

        return card;
      }

      function renderQa() {
        var token = ++renderToken;
        var sec = flat[current].sec;
        qaCount.textContent = '正在加载题目…';
        qaList.innerHTML = '';
        qaIntro.hidden = true;
        var skeleton = document.createElement('div');
        skeleton.className = 'qa-empty';
        skeleton.textContent = '正在整理这一节的题目…';
        qaList.appendChild(skeleton);

        loadItems(sec.id).then(function (block) {
          if (token !== renderToken) return;
          if (!block) {
            qaList.innerHTML = '';
            qaCount.textContent = '题目加载失败';
            var failed = document.createElement('div');
            failed.className = 'qa-empty';
            failed.textContent = '这一节的题目没能加载，可以刷新页面，或切到 LaTeX / 排版页查看。';
            qaList.appendChild(failed);
            return;
          }
          qaList.innerHTML = '';
          qaCount.innerHTML = '共 <b>' + block.items.length + '</b> 题 · 先做题，再展开答案';
          if (block.intro) {
            qaIntro.hidden = false;
            qaIntro.textContent = cleanDisplay(block.intro);
            typeset(qaIntro);
          }
          if (!block.items.length) {
            var empty = document.createElement('div');
            empty.className = 'qa-empty';
            empty.textContent = '这一节暂时没有可拆分的题目，可以切到 LaTeX 或排版页查看。';
            qaList.appendChild(empty);
            return;
          }
          var frag = document.createDocumentFragment();
          var cards = [];
          block.items.forEach(function (item, i) {
            var card = makeCard(item, i);
            cards.push(card);
            frag.appendChild(card);
          });
          qaList.appendChild(frag);
          cards.forEach(function (card) { typeset(card.querySelector('.qa-q')); });
        });
      }

      function showText() {
        var sec = flat[current].sec;
        var id = sec.id;
        if (sec.text) { text.textContent = sec.text; return; }
        text.textContent = '正在加载这一节的文字…';
        loadSection(id).then(function (full) {
          if (!full || flat[current].sec.id !== id) return;
          text.textContent = full.text || '（本节暂无文字）';
        });
      }

      function renderLatex() {
        var sec = flat[current].sec;
        var id = sec.id;
        if (!sec.latex) {
          latexPreview.textContent = '正在加载 LaTeX…';
          loadSection(id).then(function (full) {
            if (!full || flat[current].sec.id !== id) return;
            renderLatex();
          });
          return;
        }
        var src = sec.latex || '';
        latexSource.value = src;
        latexPreview.textContent = cleanDisplay(src);
        typeset(latexPreview);
      }

      function copyText(t) {
        if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
        var ta = document.createElement('textarea');
        ta.value = t; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        return Promise.resolve();
      }

      function docWrap(body) {
        return '\\documentclass[11pt]{article}\n\\usepackage[margin=2.2cm]{geometry}\n\\usepackage{amsmath,amssymb}\n\\usepackage[UTF8]{ctex}\n\\begin{document}\n\n' + body + '\n\n\\end{document}\n';
      }

      function renderToc(filter) {
        toc.innerHTML = '';
        var q = (filter || '').trim().toLowerCase();
        var shown = 0;
        data.chapters.forEach(function (ch) {
          var wrap = document.createElement('div');
          wrap.className = 'chapter';
          var h = document.createElement('h2');
          h.textContent = ch.name;
          wrap.appendChild(h);
          ch.sections.forEach(function (s) {
            var idx = flat.findIndex(function (x) { return x.sec.id === s.id; });
            if (q && s.title.toLowerCase().indexOf(q) < 0) return;
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'sec' + (idx === current ? ' active' : '');
            b.textContent = s.title;
            b.title = s.title;
            b.addEventListener('click', function () { select(idx); });
            wrap.appendChild(b);
            shown++;
          });
          if (wrap.querySelector('.sec')) toc.appendChild(wrap);
        });
        if (!shown) {
          var empty = document.createElement('div');
          empty.className = 'sec';
          empty.textContent = '没有匹配的章节';
          toc.appendChild(empty);
        }
      }

      function select(i, scroll) {
        if (i < 0 || i >= flat.length) return;
        current = i;
        var item = flat[i];
        var s = item.sec;
        title.textContent = s.title;
        kicker.textContent = item.ch + ' · ' + s.start + '–' + s.end + ' 页';
        pages.textContent = '第 ' + s.start + '–' + s.end + ' 页';
        pdf.href = 'advanced-math.pdf#page=' + s.start;
        text.textContent = s.text || '正在加载这一节的文字…';

        var html = '';
        for (var n = s.start; n <= s.end; n++) {
          var num = ('00' + n).slice(-3);
          html += '<img loading="lazy" src="pages/' + num + '.jpg" alt="' + s.title + ' 第 ' + n + ' 页">';
        }
        pageImages.innerHTML = html;
        pageImages.hidden = viewMode !== 'pages';
        text.hidden = viewMode !== 'text';
        latexView.hidden = viewMode !== 'latex';
        qaView.hidden = viewMode !== 'qa';

        if (viewMode === 'qa') renderQa();
        if (viewMode === 'latex') renderLatex();
        if (viewMode === 'text') showText();

        count.textContent = (i + 1) + ' / ' + flat.length;
        prev.disabled = i === 0;
        next.disabled = i === flat.length - 1;
        renderToc(search.value);
        history.replaceState(null, '', '#' + s.id);
        if (scroll !== false) document.querySelector('.reader').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function setView(mode) {
        viewMode = mode;
        qaView.hidden = mode !== 'qa';
        pageImages.hidden = mode !== 'pages';
        text.hidden = mode !== 'text';
        latexView.hidden = mode !== 'latex';
        viewQa.classList.toggle('active', mode === 'qa');
        viewPages.classList.toggle('active', mode === 'pages');
        viewLatex.classList.toggle('active', mode === 'latex');
        viewText.classList.toggle('active', mode === 'text');
        if (mode === 'qa') renderQa();
        if (mode === 'latex') renderLatex();
        if (mode === 'text') showText();
      }

      viewQa.addEventListener('click', function () { setView('qa'); });
      viewPages.addEventListener('click', function () { setView('pages'); });
      viewLatex.addEventListener('click', function () { setView('latex'); });
      viewText.addEventListener('click', function () { setView('text'); });

      document.getElementById('qa-expand').addEventListener('click', function () {
        Array.prototype.forEach.call(qaList.querySelectorAll('.qa-toggle'), function (b) {
          if (b.getAttribute('aria-expanded') !== 'true') b.click();
        });
      });
      document.getElementById('qa-collapse').addEventListener('click', function () {
        Array.prototype.forEach.call(qaList.querySelectorAll('.qa-toggle'), function (b) {
          if (b.getAttribute('aria-expanded') === 'true') b.click();
        });
      });

      document.getElementById('latex-copy').addEventListener('click', function () {
        copyText(latexSource.value);
        this.textContent = '已复制';
        var b = this;
        setTimeout(function () { b.textContent = '复制本节 LaTeX'; }, 1400);
      });
      document.getElementById('latex-copy-doc').addEventListener('click', function () {
        copyText(docWrap(latexSource.value));
        this.textContent = '已复制 .tex';
        var b = this;
        setTimeout(function () { b.textContent = '复制完整 .tex'; }, 1600);
      });
      document.getElementById('latex-edit').addEventListener('click', function () {
        var showSource = latexSource.hidden;
        latexSource.hidden = !showSource;
        latexPreview.hidden = showSource;
        this.textContent = showSource ? '渲染预览' : '源码 / 编辑';
        if (!showSource) {
          latexPreview.textContent = cleanDisplay(latexSource.value);
          typeset(latexPreview);
        }
      });

      prev.addEventListener('click', function () { select(current - 1); });
      next.addEventListener('click', function () { select(current + 1); });
      search.addEventListener('input', function () { renderToc(search.value); });
      document.addEventListener('keydown', function (e) {
        if (e.target === search) return;
        if (e.key === 'ArrowLeft') select(current - 1);
        if (e.key === 'ArrowRight') select(current + 1);
      });

      var hash = location.hash.replace('#', '');
      var start = Math.max(0, flat.findIndex(function (x) { return x.sec.id === hash; }));
      renderToc('');
      select(start, false);
    })();
  </script>
</body>
</html>
