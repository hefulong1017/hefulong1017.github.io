<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MWORKS 与 MATLAB · 实验报告</title>
  <meta name="description" content="MWORKS 与 MATLAB 科学计算实验：抛物方程紧差分格式、常微分方程数值解，含代码、表格与结果。">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="stylesheet" href="../katex.min.css">
  <style>
    :root {
      --bg: #f5f5f7; --surface: #fff; --ink: #1d1d1f; --muted: #6e6e73;
      --faint: #86868b; --line: rgba(0,0,0,.08); --accent: #0071e3;
      --accent-soft: rgba(0,113,227,.08); --radius: 20px;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    [data-theme="dark"] {
      --bg: #000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #a1a1a6;
      --faint: #86868b; --line: rgba(255,255,255,.1); --accent: #2997ff;
      --accent-soft: rgba(41,151,255,.14);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
      justify-content: space-between; gap: 18px; padding: 12px max(18px, calc((100vw - 1180px)/2));
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
    .back { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); }
    .top-actions { display: flex; gap: 10px; align-items: center; }
    .top-actions a, .top-actions button {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 8px 13px; font-size: 12px; color: var(--muted); cursor: pointer;
    }
    .top-actions a:hover, .top-actions button:hover { color: var(--ink); border-color: var(--muted); }

    .hero { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 52px 0 28px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 54px); letter-spacing: -.045em; line-height: 1.06; }
    .sub { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .note { margin: 16px 0 0; color: var(--faint); font-size: 12px; max-width: 58em; line-height: 1.85; }
    .note a { color: var(--accent); }

    .wrap { width: min(1180px, calc(100% - 36px)); margin: 0 auto 70px; display: grid; grid-template-columns: 250px minmax(0,1fr); gap: 22px; align-items: start; }
    .side {
      position: sticky; top: 78px; max-height: calc(100vh - 100px); overflow: auto;
      border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
      padding: 14px 12px; box-shadow: 0 12px 40px rgba(0,0,0,.05);
    }
    .side-label { margin: 4px 8px 10px; color: var(--faint); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .toc-group { margin-top: 14px; }
    .toc-group b { display: block; margin: 0 8px 6px; color: var(--ink); font-size: 11px; font-weight: 600; }
    .toc a {
      display: block; padding: 7px 9px; border-radius: 9px; color: var(--muted);
      font-size: 12px; line-height: 1.45;
    }
    .toc a:hover { background: var(--accent-soft); color: var(--ink); }
    .toc a.active { background: var(--ink); color: var(--bg); }

    .doc { min-width: 0; }
    .report { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); box-shadow: 0 12px 40px rgba(0,0,0,.06); overflow: hidden; margin-bottom: 22px; }
    .report-head { padding: 24px 28px 18px; border-bottom: 1px solid var(--line); }
    .report-head .kicker { color: var(--faint); font-size: 10px; letter-spacing: .12em; }
    .report-head h2 { margin: 8px 0 6px; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.03em; }
    .report-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .chapter { padding: 26px 28px 30px; border-top: 1px solid var(--line); scroll-margin-top: 78px; }
    .chapter:first-of-type { border-top: 0; }
    .chapter h3 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.02em; }
    .chapter p { margin: 0 0 13px; font: 15px/1.95 var(--serif); overflow-wrap: anywhere; }
    .chapter p:last-child { margin-bottom: 0; }
    .formula { margin: 14px 0 18px; padding: 6px 0; overflow-x: auto; overflow-y: hidden; }
    .formula .katex-display { margin: 0; }
    .code {
      margin: 14px 0 18px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px;
      background: #0f1115; color: #e8e8ed; overflow-x: auto;
      font: 12px/1.65 var(--mono); tab-size: 2; white-space: pre;
    }
    [data-theme="dark"] .code { background: #0a0a0c; border-color: rgba(255,255,255,.12); }
    .code code { font: inherit; white-space: inherit; }
    .table-wrap { margin: 14px 0 20px; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { background: color-mix(in srgb, var(--bg) 70%, var(--surface)); color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .empty { padding: 18px 0; color: var(--faint); font-size: 13px; }

    footer { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 26px 0 50px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; color: var(--faint); font-size: 11px; }
    footer a { color: var(--muted); }
    footer a:hover { color: var(--ink); }

    @media (max-width: 860px) {
      .wrap { grid-template-columns: minmax(0,1fr); }
      .side { position: static; max-height: 230px; }
      .doc { min-width: 0; }
      .hero { padding-top: 38px; }
      .report-head, .chapter { padding-left: 18px; padding-right: 18px; }
      .chapter p { font-size: 14px; }
      .top-actions a:first-child { display: none; }
      footer { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="../"><span class="back">何</span>何富龙</a>
    <div class="top-actions">
      <a href="https://www.tongyuan.cc/" target="_blank" rel="noreferrer">MWORKS 官网 ↗</a>
      <a href="../">返回主页</a>
    </div>
  </header>

  <section class="hero">
    <p class="eyebrow">MWORKS · MATLAB · NUMERICAL EXPERIMENTS</p>
    <h1>科学计算实验报告</h1>
    <p class="sub">抛物方程紧差分格式 · 常微分方程数值解 · 线性方程组迭代法</p>
    <p class="note">两份课程报告的正文、代码和结果表，已去掉截图与公式图片；公式用 LaTeX 重排。MWORKS 官网：<a href="https://www.tongyuan.cc/" target="_blank" rel="noreferrer">tongyuan.cc</a></p>
  </section>

  <div class="wrap">
    <aside class="side" aria-label="报告目录">
      <div class="side-label">CONTENTS</div>
      <div class="toc" id="toc"></div>
    </aside>
    <main class="doc" id="doc"></main>
  </div>

  <footer>
    <span>内容来自课程实验报告，仅作学习记录。</span>
    <span><a href="https://www.tongyuan.cc/" target="_blank" rel="noreferrer">MWORKS 官网 ↗</a></span>
  </footer>

  <script src="../katex.min.js"></script>
  <script src="../auto-render.min.js"></script>
  <script src="data.js"></script>
  <script>
    (function () {
      var data = window.MWORKS_DATA;
      var doc = document.getElementById('doc');
      var toc = document.getElementById('toc');

      function typeset(el) {
        if (!window.renderMathInElement) return;
        window.renderMathInElement(el, {
          delimiters: [
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false }
          ],
          throwOnError: false,
          strict: false
        });
      }

      function addTable(parent, rows) {
        var wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        var table = document.createElement('table');
        rows.forEach(function (row, ri) {
          var tr = document.createElement('tr');
          row.forEach(function (cell) {
            var td = document.createElement(ri === 0 ? 'th' : 'td');
            td.textContent = cell;
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
        wrap.appendChild(table);
        parent.appendChild(wrap);
      }

      if (!data || !data.reports) {
        doc.innerHTML = '<div class="empty">报告内容没有加载成功，请刷新页面。</div>';
        return;
      }

      data.reports.forEach(function (report, ri) {
        var shell = document.createElement('section');
        shell.className = 'report';
        shell.id = report.id;

        var head = document.createElement('div');
        head.className = 'report-head';
        var kicker = document.createElement('div');
        kicker.className = 'kicker';
        kicker.textContent = 'REPORT ' + String(ri + 1).padStart(2, '0');
        var h2 = document.createElement('h2');
        h2.textContent = report.title;
        var p = document.createElement('p');
        p.textContent = report.subtitle;
        head.appendChild(kicker);
        head.appendChild(h2);
        head.appendChild(p);
        shell.appendChild(head);

        var group = document.createElement('div');
        group.className = 'toc-group';
        var gb = document.createElement('b');
        gb.textContent = report.title;
        group.appendChild(gb);

        report.sections.forEach(function (sec, si) {
          var id = report.id + '-' + (si + 1);
          var chapter = document.createElement('article');
          chapter.className = 'chapter';
          chapter.id = id;
          var h3 = document.createElement('h3');
          h3.textContent = sec.title;
          chapter.appendChild(h3);

          if (!sec.blocks.length) {
            var empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '这一节没有正文。';
            chapter.appendChild(empty);
          }

          sec.blocks.forEach(function (b) {
            if (b.type === 'code') {
              var pre = document.createElement('pre');
              pre.className = 'code';
              var code = document.createElement('code');
              code.textContent = b.html;
              pre.appendChild(code);
              chapter.appendChild(pre);
            } else if (b.type === 'table') {
              addTable(chapter, b.rows);
            } else if (b.type === 'formula') {
              var f = document.createElement('div');
              f.className = 'formula';
              f.textContent = '\\[' + b.latex + '\\]';
              chapter.appendChild(f);
            } else {
              var para = document.createElement('p');
              para.textContent = b.html;
              chapter.appendChild(para);
            }
          });

          shell.appendChild(chapter);

          var link = document.createElement('a');
          link.href = '#' + id;
          link.textContent = sec.title;
          link.dataset.id = id;
          group.appendChild(link);
        });

        doc.appendChild(shell);
        toc.appendChild(group);
      });

      typeset(doc);

      var links = Array.prototype.slice.call(toc.querySelectorAll('a'));
      links.forEach(function (a) {
        a.addEventListener('click', function () {
          links.forEach(function (x) { x.classList.remove('active'); });
          a.classList.add('active');
        });
      });

      var hash = location.hash.replace('#', '');
      if (hash) {
        var target = document.getElementById(hash);
        if (target) {
          var active = toc.querySelector('a[href="#' + hash + '"]');
          if (active) active.classList.add('active');
          requestAnimationFrame(function () {
            target.scrollIntoView({ block: 'start' });
          });
        }
      }
    })();
  </script>
</body>
</html>
