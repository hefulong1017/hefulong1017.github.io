<!doctype html><meta charset="utf-8">
<body style="margin:0;font:12px monospace"><pre id="out">loading</pre>
<script>
var widths=[320,360,375,390,414,480];
var i=0, out=[];
function next(){
  if(i>=widths.length){document.getElementById('out').textContent=out.join('\n');return;}
  var w=widths[i++];
  var f=document.createElement('iframe');
  f.style.cssText='width:'+w+'px;height:600px;border:0;position:absolute;left:-9999px';
  f.src='/';
  f.onload=function(){
    setTimeout(function(){
      try{
        var d=f.contentDocument, win=f.contentWindow;
        var nav=d.querySelector('.nav');
        var links=d.querySelectorAll('.nav-links a');
        var shown=0, hidden=0;
        links.forEach(function(a){ (a.getBoundingClientRect().width?shown++:hidden++); });
        var r=nav.getBoundingClientRect();
        var kids=[].slice.call(nav.children).map(function(c){var b=c.getBoundingClientRect();return Math.round(b.width);});
        out.push('w='+w+' navScroll='+nav.scrollWidth+' navClient='+nav.clientWidth+
          ' doc='+d.documentElement.scrollWidth+' links='+links.length+' shown='+shown+
          ' children=['+kids.join(',')+']');
      }catch(e){out.push('w='+w+' ERR '+e.message);}
      f.remove(); next();
    },900);
  };
  document.body.appendChild(f);
}
next();
</script>
