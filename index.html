<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>何富龙 · 个人主页</title>
  <meta name="description" content="何富龙，数学教育方向的学习者与实践者。这里会慢慢补充文章、项目和想法。">
  <meta name="author" content="何富龙">
  <meta name="theme-color" content="#f4efe6">
  <meta property="og:type" content="website">
  <meta property="og:title" content="何富龙 · 个人主页">
  <meta property="og:description" content="数学教育 · 教学设计 · 表达。这里会慢慢补充文章、项目和想法。">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b64a32'/%3E%3Ctext x='32' y='44' font-family='serif' font-size='36' fill='%23fbf7ef' text-anchor='middle'%3E何%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4efe6;
      --bg-soft: #fbf7ef;
      --ink: #1e1c18;
      --muted: #6f6a60;
      --faint: #9b9488;
      --line: rgba(30, 28, 24, .14);
      --line-strong: rgba(30, 28, 24, .28);
      --accent: #b64a32;
      --accent-soft: rgba(182, 74, 50, .1);
      --serif: "Iowan Old Style", "Palatino Linotype", "Noto Serif SC", "Songti SC", "SimSun", serif;
      --sans: "Inter", "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --ease: cubic-bezier(.22, .61, .36, 1);
    }

    [data-theme="dark"] {
      --bg: #141412;
      --bg-soft: #1a1916;
      --ink: #f2ece1;
      --muted: #a8a094;
      --faint: #777166;
      --line: rgba(242, 236, 225, .15);
      --line-strong: rgba(242, 236, 225, .3);
      --accent: #e08363;
      --accent-soft: rgba(224, 131, 99, .12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      transition: background .45s var(--ease), color .45s var(--ease);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .2;
      background-image: radial-gradient(circle at 1px 1px, var(--line-strong) 1px, transparent 0);
      background-size: 22px 22px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
    }
    ::selection { background: var(--accent); color: var(--bg-soft); }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }

    .skip {
      position: fixed;
      top: -100px;
      left: 16px;
      z-index: 100;
      background: var(--ink);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 6px;
      transition: top .2s;
    }
    .skip:focus { top: 16px; }

    .shell {
      position: relative;
      z-index: 1;
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font-family: var(--serif);
      font-size: 16px;
      transition: background .3s, color .3s;
    }
    .brand:hover .mark { background: var(--ink); color: var(--bg); }
    .brand-text { display: grid; gap: 1px; min-width: 0; }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .brand-en { font-size: 9px; color: var(--faint); letter-spacing: .18em; }

    .theme {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      background: transparent;
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .12em;
      cursor: pointer;
      transition: border-color .25s, color .25s, background .25s;
    }
    .theme:hover { border-color: var(--ink); color: var(--ink); background: var(--accent-soft); }
    .theme-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    main {
      flex: 1;
      padding: clamp(72px, 13vh, 150px) 0 72px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 30px;
      height: 1px;
      background: var(--accent);
    }
    h1 {
      margin: 24px 0 0;
      font-family: var(--serif);
      font-size: clamp(1.9rem, 4.4vw, 2.8rem);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -.025em;
    }
    .role {
      margin: 12px 0 0;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
    }
    .intro {
      max-width: 33em;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: 14.5px;
      line-height: 2;
    }
    .intro strong { color: var(--ink); font-weight: 500; }

    .rule {
      margin: 58px 0 0;
      border: 0;
      border-top: 1px solid var(--line);
    }
    .now {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 24px;
      padding: 26px 0;
      border-bottom: 1px solid var(--line);
    }
    .label {
      color: var(--faint);
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    .now p {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
    }
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 8px;
      border-radius: 50%;
      background: var(--accent);
      vertical-align: middle;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      padding-top: 30px;
    }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      letter-spacing: .08em;
      transition: color .25s, border-color .25s;
    }
    .link:hover { color: var(--accent); border-color: var(--accent); }
    .link span { color: var(--faint); font-size: 13px; }

    footer {
      width: min(760px, calc(100% - 48px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 0 30px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-size: 9.5px;
      letter-spacing: .1em;
    }

    @media (max-width: 560px) {
      .shell, footer { width: calc(100% - 36px); }
      .top { padding: 20px 0; }
      main { padding: 64px 0 56px; }
      h1 { font-size: clamp(1.8rem, 8.4vw, 2.25rem); }
      .intro { font-size: 14px; line-height: 1.95; }
      .rule { margin-top: 44px; }
      .now { grid-template-columns: 1fr; gap: 8px; }
      footer { flex-direction: column; align-items: flex-start; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>

  <div class="shell">
    <header class="top">
      <a class="brand" href="/" aria-label="何富龙个人主页">
        <span class="mark" aria-hidden="true">何</span>
        <span class="brand-text">
          <span class="brand-name">何富龙</span>
          <span class="brand-en">HE FULONG</span>
        </span>
      </a>
      <button class="theme" id="theme-toggle" type="button" aria-label="切换深浅色主题">
        <span class="theme-dot" aria-hidden="true"></span>
        <span id="theme-label">LIGHT</span>
      </button>
    </header>

    <main id="main">
      <p class="eyebrow">Personal Index / 2026</p>
      <h1>你好，我是何富龙。</h1>
      <p class="role">数学教育 · 教学设计 · 表达</p>
      <p class="intro">我关注数学教育、课堂表达与教学工具。这个主页会慢慢补充我的<strong>文章、项目和想法</strong>。</p>

      <hr class="rule">

      <div class="now">
        <span class="label">Now</span>
        <p><span class="dot" aria-hidden="true"></span>站点正在搭建中，内容会陆续补充。</p>
      </div>

      <div class="links" aria-label="外部链接">
        <a class="link" href="https://github.com/hefulong1017" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
        <a class="link" href="https://github.com/hefulong1017?tab=repositories" target="_blank" rel="noreferrer">Repositories <span aria-hidden="true">↗</span></a>
      </div>
    </main>
  </div>

  <footer>
    <span>© 2026 何富龙</span>
    <span>LAST UPDATED · 2026.11</span>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById('theme-toggle');
      var label = document.getElementById('theme-label');
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var initial = saved || (prefersDark ? 'dark' : 'light');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        label.textContent = theme === 'dark' ? 'DARK' : 'LIGHT';
        toggle.setAttribute('aria-label', theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
      }

      apply(initial);
      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        apply(next);
        localStorage.setItem('theme', next);
      });
    })();
  </script>
</body>
</html>
